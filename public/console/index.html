<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge Room — Owner Console</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login-view" class="login-wrap hidden">
  <div class="login-card">
    <h1>Forge Room</h1>
    <p>Owner &amp; staff console</p>
    <div id="login-error" class="login-error hidden"></div>
    <form id="login-form">
      <label class="field">Email
        <input type="email" id="login-email" autocomplete="username" required>
      </label>
      <label class="field">Password
        <input type="password" id="login-password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn btn-primary" style="width:100%;padding:11px;margin-top:6px">Log in</button>
    </form>
  </div>
</div>

<div id="setup-view" class="login-wrap hidden">
  <div class="login-card">
    <h1>Welcome to Forge Room</h1>
    <p>Create your owner account to get started</p>
    <p style="font-size:12px;color:var(--muted);line-height:1.5;margin:-4px 0 14px">This runs once. The precreated admin login is for system access only and can't see member or billing data.</p>
    <div id="setup-error" class="login-error hidden"></div>
    <form id="setup-form">
      <label class="field">Your name
        <input type="text" id="setup-name" autocomplete="name" required>
      </label>
      <label class="field">Email
        <input type="email" id="setup-email" autocomplete="username" required>
      </label>
      <label class="field">Password
        <input type="password" id="setup-password" autocomplete="new-password" placeholder="At least 8 characters" required>
      </label>
      <button type="submit" class="btn btn-primary" style="width:100%;padding:11px;margin-top:6px">Create owner account</button>
    </form>
  </div>
</div>

<div id="app-shell" class="hidden">
  <div class="mobile-topbar">
    <button class="mobile-brand" id="mobile-brand-btn" type="button">
      <div class="brand-mark">F</div>
      <span id="mobile-brand-name">FORGE ROOM</span>
    </button>
    <button class="menu-toggle" id="menu-toggle-btn" type="button" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
  <aside class="sidebar" id="sidebar">
    <button class="brand" id="brand-home-btn" type="button">
      <div class="brand-mark">F</div>
      <div>
        <div class="brand-name" id="brand-name-label">FORGE ROOM</div>
        <div class="brand-sub" id="brand-sub-label">Strength Club</div>
      </div>
    </button>
    <nav id="nav-root"></nav>
    <div class="sidebar-bottom">
      <button class="kiosk-btn" id="open-kiosk-btn">
        Open door kiosk
        <small>QR + fob check-in</small>
      </button>
      <div class="who-am-i">
        <div class="avatar-sm" id="whoami-initials"></div>
        <div class="who-am-i-text">
          <b id="whoami-name"></b>
          <span id="whoami-role"></span>
        </div>
        <button class="logout-btn" id="logout-btn">Log out</button>
      </div>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <div>
        <h1 id="page-title">Today</h1>
        <p id="page-subtitle"></p>
      </div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </header>
    <nav class="sub-tabs hidden" id="sub-tabs-root"></nav>
    <div class="page" id="page-root"></div>
  </main>
</div>

<div id="modal-root"></div>
<div id="kiosk-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="vendor/jsQR.js"></script>
<script src="app.js"></script>
</body>
</html>
