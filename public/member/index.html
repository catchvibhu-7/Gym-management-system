<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge Room</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <div id="login-view" class="login-wrap">
    <div class="login-card">
      <h1>Forge Room</h1>
      <p>Log in with your mobile number</p>
      <div id="login-error" class="error-box hidden"></div>
      <form id="login-form">
        <label class="field">Mobile<input id="lf-phone" placeholder="+1 312 555 0148" required></label>
        <label class="field">PIN<input id="lf-pin" type="password" inputmode="numeric" placeholder="4-digit PIN" required></label>
        <button class="btn btn-primary" type="submit">Log in</button>
      </form>
      <p style="margin-top:12px;font-size:11.5px;color:var(--muted-2)">New here? Ask the desk to set up your account — your PIN defaults to the last 4 digits of your phone.</p>
    </div>
  </div>

  <div id="main-view" class="hidden" style="display:flex;flex-direction:column;min-height:100dvh">
    <div class="topbar">
      <div class="row1"><span id="clock"></span><span>FORGE ROOM</span></div>
      <h1 id="greeting"></h1>
      <div class="sub" id="plan-line"></div>
    </div>
    <div class="content" id="content"></div>
    <div class="tabbar">
      <button class="tab-btn active" data-tab="home">Home</button>
      <button class="tab-btn" data-tab="classes">Classes</button>
      <button class="tab-btn" data-tab="plan">My plan</button>
      <button class="tab-btn" data-tab="account">Account</button>
    </div>
  </div>

</div>
<script src="app.js"></script>
</body>
</html>
